<html lang="en">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Structured Data (JSON-LD) for Maximum SEO Power -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Tanveer Hussain",

        "https://github.com/vexornull"
      ],
      "jobTitle": "Frontend Developer & Web Creator",
      "worksFor": {
        "@type": "Organization",
        "name": "VexorNull Systems"
      }
    }

    <style>
        :root {
            --bg-color: #030712;
            --card-bg: rgba(17, 24, 39, 0.7);
            --border-color: rgba(99, 102, 241, 0.2);
            --border-hover: rgba(99, 102, 241, 0.6);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-glow: rgba(99, 102, 241, 0.45);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            background-image: 
                radial-gradient(circle at 50% -15%, rgba(99, 102, 241, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(14, 165, 233, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(168, 85, 247, 0.12) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 20px 0 35px;
        }

        .avatar-container {
            position: relative;
            width: 115px;
            height: 115px;
            margin: 0 auto 22px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid var(--accent);
            box-shadow: 0 0 35px var(--accent-glow);
            object-fit: cover;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .avatar:hover {
            transform: scale(1.08) rotate(3deg);
        }

        .status-dot {
            position: absolute;
            bottom: 6px;
            right: 6px;
            width: 16px;
            height: 16px;
            background-color: #10b981;
            border: 3px solid var(--bg-color);
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.7);
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 30%, #9ca3af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header h1 span {
            background: linear-gradient(135deg, #818cf8 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: -0.2px;
        }

        .dashboard-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 45px;
            width: 100%;
        }

        .search-bar {
            width: 100%;
            max-width: 540px;
            position: relative;
        }

        .search-bar i {
            position: absolute;
            left: 22px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }

        .search-bar input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 16px 20px 16px 54px;
            border-radius: 18px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            backdrop-filter: blur(20px);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
        }

        .search-bar input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 25px var(--accent-glow), inset 0 0 12px rgba(99, 102, 241, 0.12);
        }

        .search-bar input:focus + i {
            color: var(--accent);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 26px;
            padding-bottom: 70px;
        }

        .project-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            padding: 30px;
            backdrop-filter: blur(24px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3.5px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .project-card:hover {
            transform: translateY(-8px);
            border-color: var(--border-hover);
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.65), 0 0 25px rgba(99, 102, 241, 0.2);
        }

        .project-card:hover::before {
            opacity: 1;
        }

        .project-info h3 {
            font-size: 1.35rem;
            margin-bottom: 12px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.4px;
        }

        .project-info p {
            color: var(--text-muted);
            font-size: 0.96rem;
            margin-bottom: 26px;
            line-height: 1.7;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .project-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            padding-top: 20px;
        }

        .lang-badge {
            background: rgba(99, 102, 241, 0.1);
            color: #818cf8;
            padding: 7px 14px;
            border-radius: 12px;
            font-size: 0.84rem;
            font-weight: 600;
            border: 1px solid rgba(99, 102, 241, 0.22);
        }

        /* HEAVY PROFESSIONAL VISIT BUTTON WITH ADVANCED CSS */
        .visit-btn {
            position: relative;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            gap: 9px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
        }

        /* Shine sweep effect */
        .visit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transition: 0.5s ease;
            z-index: -1;
        }

        .visit-btn:hover::before {
            left: 100%;
        }

        .visit-btn:hover {
            transform: translateY(-3px);
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            box-shadow: 0 8px 28px rgba(99, 102, 241, 0.6), 0 0 15px rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .visit-btn:active {
            transform: translateY(-1px);
        }

        .visit-btn i {
            font-size: 0.8rem;
            transition: transform 0.3s ease;
        }

        .visit-btn:hover i {
            transform: translate(2px, -2px);
        }

        .loader {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 500;
        }

        footer {
            text-align: center;
            padding: 35px 0;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            width: 100%;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2.2rem;
            }
            .projects-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="avatar-container">
                <img src="https://github.com/vexornull.png" alt="VexorNull" class="avatar">
                <div class="status-dot" title="Systems Online"></div>
            </div>
            <h1>@<span>VexorNull</span> Hub</h1>
            <p>Central Command & Live Operational Web Applications Directory</p>
        </header>

        <div class="dashboard-controls">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search deployed web apps & tools...">
            </div>
        </div>

        <div class="projects-grid" id="projectsContainer">
            <div class="loader"><i class="fa-solid fa-circle-notch fa-spin"></i> Initializing workspace directory...</div>
        </div>
    </div>

    <footer>
        &copy; 2026 VexorNull Systems. All rights reserved.
    </footer>

    <script>
        const username = 'vexornull';
        const container = document.getElementById('projectsContainer');
        const searchInput = document.getElementById('searchInput');
        let allProjects = [];

        async function loadProjects() {
            try {
                const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=100`);
                if (!response.ok) throw new Error('Sync failed');
                
                const repos = await response.json();
                
                // STRICT FILTER: Public repos jinka GitHub Pages (has_pages) active ho
                allProjects = repos.filter(repo => {
                    const name = repo.name.toLowerCase();
                    return name !== 'home' && name !== username.toLowerCase() && !repo.private && repo.has_pages;
                });
                
                renderProjects(allProjects);
            } catch (err) {
                container.innerHTML = `<div class="loader" style="color: #f87171;"><i class="fa-solid fa-triangle-exclamation"></i> Unable to connect to deployment registry.</div>`;
            }
        }

        function renderProjects(projects) {
            if (projects.length === 0) {
                container.innerHTML = `<div class="loader">No active deployments found.</div>`;
                return;
            }

            container.innerHTML = '';
            projects.forEach(project => {
                const repoName = project.name;
                
                let displayTitle = repoName.replace(/-/g, ' ').replace(/_/g, ' ');
                let displayDesc = 'Custom web application workspace.';

                if (project.description) {
                    if (project.description.includes('|')) {
                        const parts = project.description.split('|');
                        displayTitle = parts[0].trim();
                        displayDesc = parts.slice(1).join(' ').trim();
                    } else {
                        displayDesc = project.description;
                    }
                }

                const lang = project.language || 'Application';
                const liveUrl = `https://${username}.github.io/${repoName}/`;

                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    <div class="project-info">
                        <h3>${displayTitle}</h3>
                        <p>${displayDesc}</p>
                    </div>
                    <div class="project-footer">
                        <span class="lang-badge">${lang}</span>
                        <a href="${liveUrl}" target="_blank" class="visit-btn">
                            <span>Visit</span>
                            <i class="fa-solid fa-arrow-up-right-from-square"></i>
                        </a>
                    </div>
                `;
                container.cloneNode ? container.appendChild(card) : null;
            });
        }

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allProjects.filter(p => 
                p.name.toLowerCase().includes(query) || 
                (p.description && p.description.toLowerCase().includes(query))
            );
            renderProjects(filtered);
        });

        loadProjects();
    </script>
</body>
</html>
