<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXORNULL | Central Command & Projects Hub</title>
    
    <!-- Favicon -->
   <link rel="icon" type="image/png" href="https://vexornull.github.io/favicon/favicon.png">

    <!-- Advanced SEO & Meta Tags -->
    <meta name="title" content="VEXORNULL | Central Command & Projects Hub">
    <meta name="description" content="Official digital workspace, live web applications, and development hub managed by VexorNull.">
    <meta name="keywords" content="VexorNull, Tanveer Hussain, Projects Hub, Web Apps, Developer Portfolio, Vercel, GitHub">
    <meta name="author" content="VexorNull">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://vexornull-home.vercel.app/">
    <meta property="og:title" content="VEXORNULL | Central Command & Projects Hub">
    <meta property="og:description" content="Official digital workspace and live web applications managed by VexorNull.">
    <meta property="og:image" content="https://github.com/vexornull.png">
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #030712;
            --card-bg: rgba(17, 24, 39, 0.65);
            --border-color: rgba(99, 102, 241, 0.18);
            --border-hover: rgba(99, 102, 241, 0.5);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-glow: rgba(99, 102, 241, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            background-image: 
                radial-gradient(circle at 50% -10%, rgba(99, 102, 241, 0.22) 0%, transparent 55%),
                radial-gradient(circle at 0% 100%, rgba(14, 165, 233, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(168, 85, 247, 0.1) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 40px 0 30px;
        }

        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 22px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2.5px solid var(--accent);
            box-shadow: 0 0 30px var(--accent-glow);
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .avatar:hover {
            transform: scale(1.05);
        }

        .status-dot {
            position: absolute;
            bottom: 6px;
            right: 6px;
            width: 16px;
            height: 16px;
            background-color: #10b981;
            border: 3px solid var(--bg-color);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        header h1 {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: -0.8px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff 30%, #9ca3af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header h1 span {
            background: linear-gradient(135deg, #818cf8 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.05rem;
            font-weight: 500;
        }

        .dashboard-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            width: 100%;
        }

        .search-bar {
            width: 100%;
            max-width: 520px;
            position: relative;
        }

        .search-bar i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        .search-bar input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px 20px 15px 52px;
            border-radius: 16px;
            color: var(--text-main);
            font-size: 0.98rem;
            outline: none;
            backdrop-filter: blur(16px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .search-bar input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow), inset 0 0 10px rgba(99, 102, 241, 0.1);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 24px;
            padding-bottom: 60px;
        }

        .project-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 28px;
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .project-card:hover {
            transform: translateY(-8px);
            border-color: var(--border-hover);
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(99, 102, 241, 0.15);
        }

        .project-card:hover::before {
            opacity: 1;
        }

        .project-info h3 {
            font-size: 1.3rem;
            margin-bottom: 12px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.3px;
        }

        .project-info p {
            color: var(--text-muted);
            font-size: 0.94rem;
            margin-bottom: 24px;
            line-height: 1.65;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .project-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 18px;
        }

        .lang-badge {
            background: rgba(99, 102, 241, 0.12);
            color: #818cf8;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 600;
            border: 1px solid rgba(99, 102, 241, 0.25);
        }

        .action-btn {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
            color: white;
            padding: 9px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .action-btn.source-only {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            box-shadow: none;
        }

        .action-btn.source-only:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: none;
            transform: none;
        }

        .loader {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 500;
        }

        footer {
            text-align: center;
            padding: 30px 0;
            color: var(--text-muted);
            font-size: 0.88rem;
            border-top: 1px solid var(--border-color);
            width: 100%;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2.1rem;
            }
            .projects-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="avatar-container">
                <img src="https://github.com/vexornull.png" alt="VexorNull" class="avatar">
                <div class="status-dot" title="Systems Online"></div>
            </div>
            <h1>@<span>VexorNull</span> Hub</h1>
            <p>Centralized Workspace & Live Application Directory</p>
        </header>

        <div class="dashboard-controls">
            <div class="search-bar">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search operational apps & tools...">
            </div>
        </div>

        <div class="projects-grid" id="projectsContainer">
            <div class="loader"><i class="fa-solid fa-circle-notch fa-spin"></i> Initializing workspace directory...</div>
        </div>
    </div>

    <footer>
        &copy; 2026 VexorNull Systems. All rights reserved.
    </footer>

    <script>
        const username = 'vexornull';
        const container = document.getElementById('projectsContainer');
        const searchInput = document.getElementById('searchInput');
        let allProjects = [];

        async function loadProjects() {
            try {
                const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=100`);
                if (!response.ok) throw new Error('Sync failed');
                
                const repos = await response.json();
                
                allProjects = repos.filter(repo => {
                    const name = repo.name.toLowerCase();
                    return name !== 'home' && name !== username.toLowerCase() && !repo.private;
                });
                
                renderProjects(allProjects);
            } catch (err) {
                container.innerHTML = `<div class="loader" style="color: #f87171;"><i class="fa-solid fa-triangle-exclamation"></i> Unable to connect to deployment registry.</div>`;
            }
        }

        function renderProjects(projects) {
            if (projects.length === 0) {
                container.innerHTML = `<div class="loader">No active deployments found.</div>`;
                return;
            }

            container.innerHTML = '';
            projects.forEach(project => {
                const repoName = project.name;
                
                let displayTitle = repoName.replace(/-/g, ' ').replace(/_/g, ' ');
                let displayDesc = 'Custom web application workspace.';

                if (project.description) {
                    if (project.description.includes('|')) {
                        const parts = project.description.split('|');
                        displayTitle = parts[0].trim();
                        displayDesc = parts.slice(1).join(' ').trim();
                    } else {
                        displayDesc = project.description;
                    }
                }

                const lang = project.language || 'Application';
                const isLiveDeployed = project.has_pages;
                
                const targetUrl = isLiveDeployed 
                    ? `https://${username}.github.io/${repoName}/` 
                    : project.html_url;
                
                const btnText = isLiveDeployed ? 'Launch App' : 'Source Code';
                const btnIcon = isLiveDeployed ? 'fa-arrow-up-right-from-square' : 'fa-code';
                const btnClass = isLiveDeployed ? 'action-btn' : 'action-btn source-only';

                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    <div class="project-info">
                        <h3>${displayTitle}</h3>
                        <p>${displayDesc}</p>
                    </div>
                    <div class="project-footer">
                        <span class="lang-badge">${lang}</span>
                        <a href="${targetUrl}" target="_blank" class="${btnClass}">
                            <span>${btnText}</span>
                            <i class="fa-solid ${btnIcon}"></i>
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allProjects.filter(p => 
                p.name.toLowerCase().includes(query) || 
                (p.description && p.description.toLowerCase().includes(query))
            );
            renderProjects(filtered);
        });

        loadProjects();
    </script>
</body>
</html>
