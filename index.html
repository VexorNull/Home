<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="author" content="VexorNull">

    <!-- Twitter Card SEO -->
    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="VEXORNULL | Central Command & Professional Projects Hub">
    <meta name="twitter:description" content="Explore official live web applications and digital tools engineered by VexorNull.">
    <meta name="twitter:image" content="https://github.com/vexornull.png">
    
    <!-- Custom Favicon -->
    <link rel="icon" type="image/png" href="https://vexornull.github.io/favicon/favicon.png">

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Structured Data (JSON-LD) for Maximum SEO Power -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Tanveer Hussain",
      "alternateName": "VexorNull",
      "url": "https://vexornull-home.vercel.app/",
      "image": "https://github.com/vexornull.png",
      "sameAs": [
        "https://github.com/vexornull"
      ],
      "jobTitle": "Frontend Developer & Web Creator",
      "worksFor": {
        "@type": "Organization",
        "name": "VexorNull Systems"
      }
    }
    </script>

    <style>
        :root {
            --bg-color: #030712;
            --card-bg: rgba(17, 24, 39, 0.72);
            --border-color: rgba(99, 102, 241, 0.22);
            --border-hover: rgba(99, 102, 241, 0.7);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-glow: rgba(99, 102, 241, 0.55);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Ambient Background Glows */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            background-image: 
                radial-gradient(circle at 15% 10%, rgba(99, 102, 241, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 85% 90%, rgba(14, 165, 233, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.12) 0%, transparent 60%);
            animation: pulseGlow 12s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.08); opacity: 1; }
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            z-index: 1;
        }

        header {
            text-align: center;
            padding: 20px 0 25px;
            animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 24px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid var(--accent);
            box-shadow: 0 0 40px var(--accent-glow);
            object-fit: cover;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: floatAvatar 4s ease-in-out infinite;
        }

        @keyframes floatAvatar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .avatar:hover {
            transform: scale(1.1) rotate(5deg);
        }

        .status-dot {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 16px;
            height: 16px;
            background-color: #10b981;
            border: 3px solid var(--bg-color);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.9);
            animation: pulseDot 2s infinite;
        }

        @keyframes pulseDot {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        header h1 {
            font-size: 2.9rem;
            font-weight: 800;
            letter-spacing: -1.2px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 20%, #9ca3af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header h1 span {
            background: linear-gradient(135deg, #818cf8 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.12rem;
            font-weight: 500;
            letter-spacing: -0.2px;
            margin-bottom: 15px;
        }

        .header-meta {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 5px;
        }

        .stats-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.88rem;
            font-weight: 600;
            color: #818cf8;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.15);
        }

        .stats-badge i {
            color: #10b981;
            font-size: 0.75rem;
        }

        .uptime-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.88rem;
            font-weight: 600;
            color: #34d399;
            backdrop-filter: blur(10px);
        }

        .dashboard-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
            width: 100%;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
            opacity: 0;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .search-sort-bar {
            width: 100%;
            max-width: 700px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .search-bar {
            flex: 1;
            position: relative;
        }

        .search-bar i {
            position: absolute;
            left: 22px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .search-bar input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 16px 20px 16px 54px;
            border-radius: 20px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            backdrop-filter: blur(25px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
        }

        .search-bar input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 30px var(--accent-glow), inset 0 0 15px rgba(99, 102, 241, 0.15);
            transform: translateY(-2px);
        }

        .search-bar input:focus + i {
            color: var(--accent);
            transform: translateY(-50%) scale(1.15);
        }

        .sort-select {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 16px 20px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            backdrop-filter: blur(25px);
            transition: all 0.3s ease;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
        }

        .sort-select:hover, .sort-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .sort-select option {
            background: #030712;
            color: var(--text-main);
        }

        .filter-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            max-width: 850px;
        }

        .filter-tag {
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 7px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(15px);
            transition: all 0.3s ease;
        }

        .filter-tag:hover, .filter-tag.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 0 18px var(--accent-glow);
            transform: translateY(-2px);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 26px;
            padding-bottom: 70px;
        }

        .project-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 30px;
            backdrop-filter: blur(28px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.45s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            animation: cardEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(40px);
        }

        @keyframes cardEntrance {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .project-card:hover {
            transform: translateY(-10px) scale(1.01);
            border-color: var(--border-hover);
            box-shadow: 0 22px 55px rgba(0, 0, 0, 0.75), 0 0 30px rgba(99, 102, 241, 0.25);
        }

        .project-card:hover::before {
            opacity: 1;
        }

        .project-info h3 {
            font-size: 1.38rem;
            margin-bottom: 12px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.4px;
        }

        .project-info p {
            color: var(--text-muted);
            font-size: 0.96rem;
            margin-bottom: 20px;
            line-height: 1.7;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .meta-stats {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .meta-stats span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .project-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            padding-top: 20px;
        }

        .lang-badge {
            background: rgba(99, 102, 241, 0.12);
            color: #818cf8;
            padding: 7px 14px;
            border-radius: 12px;
            font-size: 0.84rem;
            font-weight: 600;
            border: 1px solid rgba(99, 102, 241, 0.25);
        }

        .visit-btn {
            position: relative;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            padding: 11px 26px;
            border-radius: 15px;
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 700;
            letter-spacing: 0.4px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 5px 22px rgba(99, 102, 241, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
        }

        .visit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
            transition: 0.6s ease;
            z-index: -1;
        }

        .visit-btn:hover::before {
            left: 100%;
        }

        .visit-btn:hover {
            transform: translateY(-4px) scale(1.03);
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            box-shadow: 0 10px 32px rgba(99, 102, 241, 0.65), 0 0 20px rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .visit-btn i {
            font-size: 0.8rem;
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .visit-btn:hover i {
            transform: translate(3px, -3px) scale(1.1);
        }

        .loader {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
            font-size: 1.15rem;
            font-weight: 500;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        footer {
            text-align: center;
            padding: 35px 0;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            width: 100%;
            font-weight: 500;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
            opacity: 0;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2.2rem;
            }
            .search-sort-bar {
                flex-direction: column;
            }
            .sort-select {
                width: 100%;
            }
            .projects-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>

    <div class="container">
        <header>
            <div class="avatar-container">
                <img src="https://github.com/vexornull.png" alt="VexorNull" class="avatar">
                <div class="status-dot" title="Systems Online"></div>
            </div>
            <h1>@<span>VexorNull</span> Hub</h1>
            <p>Central Command & Live Operational Web Applications Directory</p>
            <div class="header-meta">
                <div class="stats-badge" id="statsBadge">
                    <i class="fa-solid fa-circle"></i> <span id="appCount">Loading active deployments...</span>
                </div>
                <div class="uptime-badge">
                    <i class="fa-solid fa-bolt" style="color: #34d399;"></i> Systems Operational
                </div>
            </div>
        </header>

        <div class="dashboard-controls">
            <div class="search-sort-bar">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Search deployed web apps & tools...">
                </div>
                <select id="sortSelect" class="sort-select">
                    <option value="recent">Newest Updated</option>
                    <option value="name">Alphabetical (A-Z)</option>
                </select>
            </div>
            <div class="filter-tags" id="filterContainer">
                <!-- Dynamic filter buttons will appear here -->
            </div>
        </div>

        <div class="projects-grid" id="projectsContainer">
            <div class="loader"><i class="fa-solid fa-circle-notch fa-spin"></i> Initializing workspace directory...</div>
        </div>
    </div>

    <footer>
        &copy; 2026 VexorNull Systems. All rights reserved.
    </footer>

    <script>
        const username = 'vexornull';
        const container = document.getElementById('projectsContainer');
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');
        const filterContainer = document.getElementById('filterContainer');
        const appCount = document.getElementById('appCount');
        
        let allProjects = [];
        let currentFilter = 'all';

        async function loadProjects() {
            try {
                const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=100`);
                if (!response.ok) throw new Error('Sync failed');
                
                const repos = await response.json();
                
                // STRICT FILTER: Public repos jinka GitHub Pages (has_pages) active ho
                allProjects = repos.filter(repo => {
                    const name = repo.name.toLowerCase();
                    return name !== 'home' && name !== username.toLowerCase() && !repo.private && repo.has_pages;
                });
                
                appCount.textContent = `${allProjects.length} Active Deployed Web Apps`;
                buildFilters();
                filterAndRender();
            } catch (err) {
                container.innerHTML = `<div class="loader" style="color: #f87171;"><i class="fa-solid fa-triangle-exclamation"></i> Unable to connect to deployment registry.</div>`;
                appCount.textContent = `Registry Connection Failed`;
            }
        }

        function buildFilters() {
            const languages = ['all', ...new Set(allProjects.map(p => p.language).filter(Boolean))];
            filterContainer.innerHTML = '';

            languages.forEach(lang => {
                const btn = document.createElement('button');
                btn.className = `filter-tag ${lang === 'all' ? 'active' : ''}`;
                btn.textContent = lang === 'all' ? 'All Apps' : lang;
                btn.onclick = () => {
                    document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = lang;
                    filterAndRender();
                };
                filterContainer.appendChild(btn);
            });
        }

        function filterAndRender() {
            const query = searchInput.value.toLowerCase();
            const sortBy = sortSelect.value;

            let filtered = allProjects.filter(p => {
                const matchesQuery = p.name.toLowerCase().includes(query) || 
                                     (p.description && p.description.toLowerCase().includes(query));
                const matchesLang = currentFilter === 'all' || p.language === currentFilter;
                return matchesQuery && matchesLang;
            });

            // Sorting logic
            if (sortBy === 'recent') {
                filtered.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
            } else if (sortBy === 'name') {
                filtered.sort((a, b) => a.name.localeCompare(b.name));
            }

            renderProjects(filtered);
        }

        function renderProjects(projects) {
            if (projects.length === 0) {
                container.innerHTML = `<div class="loader"><i class="fa-solid fa-folder-open" style="font-size: 2rem; margin-bottom: 10px; display: block;"></i>No operational apps match your criteria.</div>`;
                return;
            }

            container.innerHTML = '';
            projects.forEach((project, index) => {
                const repoName = project.name;
                
                let displayTitle = repoName.replace(/-/g, ' ').replace(/_/g, ' ');
                let displayDesc = 'Custom web application workspace.';

                if (project.description) {
                    if (project.description.includes('|')) {
                        const parts = project.description.split('|');
                        displayTitle = parts[0].trim();
                        displayDesc = parts.slice(1).join(' ').trim();
                    } else {
                        displayDesc = project.description;
                    }
                }

                const lang = project.language || 'Application';
                const liveUrl = `https://${username}.github.io/${repoName}/`;
                const stars = project.stargazers_count;
                const forks = project.forks_count;

                const card = document.createElement('div');
                card.className = 'project-card';
                card.style.animationDelay = `${index * 0.05}s`;
                
                card.innerHTML = `
                    <div class="project-info">
                        <h3>${displayTitle}</h3>
                        <p>${displayDesc}</p>
                        <div class="meta-stats">
                            ${stars > 0 ? `<span><i class="fa-solid fa-star" style="color: #fbbf24;"></i> ${stars}</span>` : ''}
                            ${forks > 0 ? `<span><i class="fa-solid fa-code-fork"></i> ${forks}</span>` : ''}
                        </div>
                    </div>
                    <div class="project-footer">
                        <span class="lang-badge">${lang}</span>
                        <a href="${liveUrl}" target="_blank" class="visit-btn">
                            <span>Visit App</span>
                            <i class="fa-solid fa-arrow-up-right-from-square"></i>
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        searchInput.addEventListener('input', filterAndRender);
        sortSelect.addEventListener('change', filterAndRender);

        loadProjects();
    </script>
</body>
</html>
