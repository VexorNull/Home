<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta & Advanced SEO Tags -->
    <title>VEXORNULL | Central Command & Professional Projects Hub</title>
    <meta name="title" content="VEXORNULL | Central Command & Professional Projects Hub">
    <meta name="description" content="Explore official live web applications, digital tools, and frontend development portfolio managed by VexorNull (Tanveer Hussain).">
    <meta name="keywords" content="VexorNull, Tanveer Hussain, Projects Hub, Web Apps, Frontend Developer, Vercel, GitHub Pages, Karachi">
    <meta name="author" content="VexorNull">
    <meta name="robots" content="index, follow">
    <meta name="language" content="English">
    <meta name="theme-color" content="#030712">

    <!-- Open Graph / Facebook SEO -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://vexornull-home.vercel.app/">
    <meta property="og:title" content="VEXORNULL | Central Command & Professional Projects Hub">
    <meta property="og:description" content="Explore official live web applications and digital tools engineered by VexorNull.">
    <meta property="og:image" content="https://github.com/vexornull.png">

    <!-- Twitter Card SEO -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://vexornull-home.vercel.app/">
    <meta name="twitter:title" content="VEXORNULL | Central Command & Professional Projects Hub">
    <meta name="twitter:description" content="Explore official live web applications and digital tools engineered by VexorNull.">
    <meta name="twitter:image" content="https://github.com/vexornull.png">
    
    <!-- Custom Favicon -->
    <link rel="icon" type="image/png" href="https://vexornull.github.io/favicon/favicon.png">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Tanveer Hussain",
      "alternateName": "VexorNull",
      "url": "https://vexornull-home.vercel.app/",
      "image": "https://github.com/vexornull.png",
      "sameAs": [
        "https://github.com/vexornull",
        "https://instagram.com/vexornull",
        "https://youtube.com/@vexornull",
        "https://tiktok.com/@vexornull"
      ],
      "jobTitle": "Frontend Developer & Web Creator"
    }
    </script>

    <style>
        :root {
            --bg-color: #030712;
            --card-bg: rgba(17, 24, 39, 0.85);
            --border-color: rgba(99, 102, 241, 0.2);
            --border-hover: rgba(99, 102, 241, 0.6);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-glow: rgba(99, 102, 241, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
            overflow-x: hidden;
            position: relative;
        }

        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            background: radial-gradient(circle at 50% 10%, rgba(99, 102, 241, 0.15) 0%, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            z-index: 1;
        }

        header {
            text-align: center;
            padding: 10px 0 20px;
        }

        .avatar-container {
            position: relative;
            width: 105px;
            height: 105px;
            margin: 0 auto 20px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid var(--accent);
            box-shadow: 0 0 25px var(--accent-glow);
            object-fit: cover;
        }

        .status-dot {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 14px;
            height: 14px;
            background-color: #10b981;
            border: 2px solid var(--bg-color);
            border-radius: 50%;
        }

        header h1 {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 8px;
            color: #fff;
        }

        header h1 span {
            color: #818cf8;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-bottom: 15px;
        }

        .social-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .social-chip {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(17, 24, 39, 0.9);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-decoration: none;
            transition: all 0.25s ease;
        }

        .social-chip:hover {
            border-color: var(--accent);
            color: #fff;
            background: rgba(99, 102, 241, 0.15);
            transform: translateY(-2px);
        }

        .social-chip i {
            color: #818cf8;
            font-size: 0.95rem;
        }

        .header-meta {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .stats-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #818cf8;
        }

        .dashboard-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            width: 100%;
        }

        .search-sort-bar {
            width: 100%;
            max-width: 650px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .search-bar {
            flex: 1;
            position: relative;
        }

        .search-bar i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-bar input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 14px 18px 14px 48px;
            border-radius: 16px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .search-bar input:focus {
            border-color: var(--accent);
        }

        .sort-select {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 14px 16px;
            border-radius: 16px;
            font-size: 0.9rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        .sort-select option {
            background: #030712;
        }

        .filter-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            max-width: 800px;
        }

        .filter-tag {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-tag:hover, .filter-tag.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 22px;
            padding-bottom: 50px;
        }

        .project-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .project-card:hover {
            transform: translateY(-5px);
            border-color: var(--border-hover);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(99, 102, 241, 0.15);
        }

        .project-info h3 {
            font-size: 1.3rem;
            margin-bottom: 10px;
            font-weight: 700;
            color: var(--text-main);
        }

        .project-info p {
            color: var(--text-muted);
            font-size: 0.93rem;
            margin-bottom: 16px;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .meta-stats {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .meta-stats span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .project-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 16px;
        }

        .lang-badge {
            background: rgba(99, 102, 241, 0.1);
            color: #818cf8;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 0.81rem;
            font-weight: 600;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        /* 3D Realistic Interactive Launch Button */
        .launch-btn-3d {
            position: relative;
            background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.35);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        .launch-btn-3d::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: 0.5s ease;
        }

        .launch-btn-3d:hover::after {
            left: 100%;
        }

        .launch-btn-3d:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 10px 28px rgba(99, 102, 241, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.5);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .launch-btn-3d:active {
            transform: translateY(1px) scale(0.98);
        }

        .launch-btn-3d i {
            font-size: 0.78rem;
            transition: transform 0.3s ease;
        }

        .launch-btn-3d:hover i {
            transform: translate(2px, -2px);
        }

        .loader {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        footer {
            text-align: center;
            padding: 30px 0;
            color: var(--text-muted);
            font-size: 0.88rem;
            border-top: 1px solid var(--border-color);
            width: 100%;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }
            .search-sort-bar {
                flex-direction: column;
            }
            .sort-select {
                width: 100%;
            }
            .projects-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>

    <div class="container">
        <header>
            <div class="avatar-container">
                <img src="https://github.com/vexornull.png" alt="VexorNull" class="avatar">
                <div class="status-dot"></div>
            </div>
            <h1>@<span>VexorNull</span> Hub</h1>
            <p>Central Command & Live Operational Web Applications Directory</p>
            
            <div class="social-bar">
                <a href="https://github.com/vexornull" target="_blank" class="social-chip">
                    <i class="fa-brands fa-github"></i> @vexornull
                </a>
                <a href="https://instagram.com/vexornull" target="_blank" class="social-chip">
                    <i class="fa-brands fa-instagram"></i> @vexornull
                </a>
                <a href="https://youtube.com/@vexornull" target="_blank" class="social-chip">
                    <i class="fa-brands fa-youtube"></i> @vexornull
                </a>
                <a href="https://tiktok.com/@vexornull" target="_blank" class="social-chip">
                    <i class="fa-brands fa-tiktok"></i> @vexornull
                </a>
                <a href="https://vercel.com/vexornull" target="_blank" class="social-chip">
                    <i class="fa-solid fa-triangle-exclamation"></i> Vercel
                </a>
            </div>

            <div class="header-meta">
                <div class="stats-badge" id="statsBadge">
                    <i class="fa-solid fa-circle" style="font-size: 7px; color: #10b981;"></i> <span id="appCount">Loading active deployments...</span>
                </div>
            </div>
        </header>

        <div class="dashboard-controls">
            <div class="search-sort-bar">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Search deployed web apps & tools...">
                </div>
                <select id="sortSelect" class="sort-select">
                    <option value="recent">Newest Updated</option>
                    <option value="name">Alphabetical (A-Z)</option>
                </select>
            </div>
            <div class="filter-tags" id="filterContainer"></div>
        </div>

        <div class="projects-grid" id="projectsContainer">
            <div class="loader"><i class="fa-solid fa-circle-notch fa-spin"></i> Initializing workspace...</div>
        </div>
    </div>

    <footer>
        &copy; 2026 VexorNull Systems. All rights reserved.
    </footer>

    <script>
        const username = 'vexornull';
        const container = document.getElementById('projectsContainer');
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');
        const filterContainer = document.getElementById('filterContainer');
        const appCount = document.getElementById('appCount');
        
        let allProjects = [];
        let currentFilter = 'all';

        async function loadProjects() {
            try {
                const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=100`);
                if (!response.ok) throw new Error('Sync failed');
                
                const repos = await response.json();
                
                allProjects = repos.filter(repo => {
                    const name = repo.name.toLowerCase();
                    return name !== 'home' && name !== username.toLowerCase() && !repo.private && repo.has_pages;
                });
                
                appCount.textContent = `${allProjects.length} Active Deployed Web Apps`;
                buildFilters();
                filterAndRender();
            } catch (err) {
                container.innerHTML = `<div class="loader" style="color: #f87171;"><i class="fa-solid fa-triangle-exclamation"></i> Unable to connect to deployment registry.</div>`;
                appCount.textContent = `Registry Connection Failed`;
            }
        }

        function buildFilters() {
            const languages = ['all', ...new Set(allProjects.map(p => p.language).filter(Boolean))];
            filterContainer.innerHTML = '';

            languages.forEach(lang => {
                const btn = document.createElement('button');
                btn.className = `filter-tag ${lang === 'all' ? 'active' : ''}`;
                btn.textContent = lang === 'all' ? 'All Apps' : lang;
                btn.onclick = () => {
                    document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = lang;
                    filterAndRender();
                };
                filterContainer.appendChild(btn);
            });
        }

        function filterAndRender() {
            const query = searchInput.value.toLowerCase();
            const sortBy = sortSelect.value;

            let filtered = allProjects.filter(p => {
                const matchesQuery = p.name.toLowerCase().includes(query) || 
                                     (p.description && p.description.toLowerCase().includes(query));
                const matchesLang = currentFilter === 'all' || p.language === currentFilter;
                return matchesQuery && matchesLang;
            });

            if (sortBy === 'recent') {
                filtered.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
            } else if (sortBy === 'name') {
                filtered.sort((a, b) => a.name.localeCompare(b.name));
            }

            renderProjects(filtered);
        }

        function renderProjects(projects) {
            if (projects.length === 0) {
                container.innerHTML = `<div class="loader"><i class="fa-solid fa-folder-open" style="font-size: 1.8rem; margin-bottom: 8px; display: block;"></i>No operational apps match your criteria.</div>`;
                return;
            }

            container.innerHTML = '';
            projects.forEach((project) => {
                const repoName = project.name;
                
                let displayTitle = repoName.replace(/-/g, ' ').replace(/_/g, ' ');
                let displayDesc = 'Custom web application workspace.';

                if (project.description) {
                    if (project.description.includes('|')) {
                        const parts = project.description.split('|');
                        displayTitle = parts[0].trim();
                        displayDesc = parts.slice(1).join(' ').trim();
                    } else {
                        displayDesc = project.description;
                    }
                }

                const lang = project.language || 'Application';
                const liveUrl = `https://${username}.github.io/${repoName}/`;
                const stars = project.stargazers_count;
                const forks = project.forks_count;

                const card = document.createElement('div');
                card.className = 'project-card';
                
                card.innerHTML = `
                    <div class="project-info">
                        <h3>${displayTitle}</h3>
                        <p>${displayDesc}</p>
                        <div class="meta-stats">
                            ${stars > 0 ? `<span><i class="fa-solid fa-star" style="color: #fbbf24;"></i> ${stars}</span>` : ''}
                            ${forks > 0 ? `<span><i class="fa-solid fa-code-fork"></i> ${forks}</span>` : ''}
                        </div>
                    </div>
                    <div class="project-footer">
                        <span class="lang-badge">${lang}</span>
                        <a href="${liveUrl}" target="_blank" class="launch-btn-3d">
                            <span>Launch</span>
                            <i class="fa-solid fa-rocket"></i>
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        searchInput.addEventListener('input', filterAndRender);
        sortSelect.addEventListener('change', filterAndRender);

        loadProjects();
    </script>
</body>
</html>
