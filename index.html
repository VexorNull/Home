<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VexorNull | Portfolio & Projects Hub</title>
    
    <!-- SEO & Meta Tags -->
    <meta name="title" content="VexorNull | Portfolio & Projects Hub">
    <meta name="description" content="Explore live web projects, repositories, and applications built by VexorNull (@vexornull).">
    <meta name="keywords" content="VexorNull, Tanveer Hussain, GitHub Projects, Web Development, Frontend, Portfolio">
    <meta name="author" content="VexorNull">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://vexornull.github.io/">
    <meta property="og:title" content="VexorNull | Portfolio & Projects Hub">
    <meta property="og:description" content="Explore live web projects and repositories built by VexorNull.">
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 50px 0 30px;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        header h1 span {
            color: var(--accent);
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .search-bar {
            width: 100%;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
        }

        .search-bar input {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 12px 20px;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .search-bar input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            padding-bottom: 50px;
        }

        .project-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-5px);
            border-color: rgba(99, 102, 241, 0.5);
        }

        .project-info h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .project-info h3 a {
            color: var(--text-main);
            text-decoration: none;
        }

        .project-info h3 a:hover {
            color: var(--accent);
        }

        .project-info p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .project-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            font-size: 0.85rem;
        }

        .lang-badge {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 500;
        }

        .links-group {
            display: flex;
            gap: 12px;
        }

        .links-group a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 1.1rem;
            transition: color 0.2s;
        }

        .links-group a:hover {
            color: var(--accent);
        }

        .loader {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        footer {
            text-align: center;
            padding: 20px 0;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <img src="https://github.com/vexornull.png" alt="VexorNull" class="avatar">
            <h1>@<span>VexorNull</span> Hub</h1>
            <p>Automated repository dashboard and live project previews</p>
        </header>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search projects...">
        </div>

        <div class="projects-grid" id="projectsContainer">
            <div class="loader"><i class="fa-solid fa-spinner fa-spin"></i> Fetching repositories...</div>
        </div>
    </div>

    <footer>
        &copy; 2026 VexorNull. All rights reserved.
    </footer>

    <script>
        const username = 'vexornull';
        const container = document.getElementById('projectsContainer');
        const searchInput = document.getElementById('searchInput');
        let allRepos = [];

        async function fetchRepositories() {
            try {
                const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=100`);
                if (!response.ok) throw new Error('Failed to fetch repositories');
                
                const repos = await response.json();
                // Filter out the main profile repo itself if desired, or keep it
                allRepos = repos.filter(repo => repo.name.toLowerCase() !== username.toLowerCase());
                
                displayProjects(allRepos);
            } catch (error) {
                container.innerHTML = `<div class="loader" style="color: #ef4444;">Error loading projects. Please try again later.</div>`;
            }
        }

        function displayProjects(repos) {
            if (repos.length === 0) {
                container.innerHTML = `<div class="loader">No repositories found.</div>`;
                return;
            }

            container.innerHTML = '';
            repos.forEach(repo => {
                const desc = repo.description || 'No description provided.';
                const lang = repo.language || 'Code';
                // Check if GitHub Pages is available (usually username.github.io/reponame)
                const liveUrl = `https://${username}.github.io/${repo.name}/`;
                const repoUrl = repo.html_url;

                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    <div class="project-info">
                        <h3>
                            <a href="${liveUrl}" target="_blank">${repo.name}</a>
                        </h3>
                        <p>${desc}</p>
                    </div>
                    <div class="project-footer">
                        <span class="lang-badge">${lang}</span>
                        <div class="links-group">
                            <a href="${repoUrl}" target="_blank" title="View Source"><i class="fa-brands fa-github"></i></a>
                            <a href="${liveUrl}" target="_blank" title="Live Preview"><i class="fa-solid fa-external-link-alt"></i></a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allRepos.filter(repo => 
                repo.name.toLowerCase().includes(term) || 
                (repo.description && repo.description.toLowerCase().includes(term))
            );
            displayProjects(filtered);
        });

        fetchRepositories();
    </script>
</body>
</html>
