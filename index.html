<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXORNULL | Central Command & Projects Hub</title>
    
    <!-- Advanced SEO & Meta Tags -->
    <meta name="title" content="VEXORNULL | Central Command & Projects Hub">
    <meta name="description" content="Official digital workspace, live web applications, and development hub managed by VexorNull.">
    <meta name="keywords" content="VexorNull, Tanveer Hussain, Projects Hub, Web Apps, Developer Portfolio, Vercel, GitHub">
    <meta name="author" content="VexorNull">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://vexornull-home.vercel.app/">
    <meta property="og:title" content="VEXORNULL | Central Command & Projects Hub">
    <meta property="og:description" content="Official digital workspace and live web applications managed by VexorNull.">
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: rgba(13, 17, 23, 0.75);
            --border-color: rgba(99, 102, 241, 0.15);
            --text-main: #f3f4f6;
            --text-muted: #8b949e;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(99, 102, 241, 0.2) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(14, 165, 233, 0.1) 0%, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 1150px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 60px 0 30px;
        }

        .avatar-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--accent);
            box-shadow: 0 0 25px var(--accent-glow);
            object-fit: cover;
        }

        .status-dot {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 14px;
            height: 14px;
            background-color: #10b981;
            border: 2px solid var(--bg-color);
            border-radius: 50%;
        }

        header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        header h1 span {
            color: var(--accent);
        }

        header p {
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        .dashboard-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 35px;
            width: 100%;
        }

        .search-bar {
            width: 100%;
            max-width: 480px;
            position: relative;
        }

        .search-bar i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-bar input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 14px 20px 14px 48px;
            border-radius: 14px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
        }

        .search-bar input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 22px;
            padding-bottom: 60px;
        }

        .project-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 26px;
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-6px);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .project-card:hover::before {
            opacity: 1;
        }

        .project-info h3 {
            font-size: 1.25rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .project-info h3 a {
            color: var(--text-main);
            text-decoration: none;
            transition: color 0.2s;
        }

        .project-info h3 a:hover {
            color: var(--accent);
        }

        .project-info p {
            color: var(--text-muted);
            font-size: 0.92rem;
            margin-bottom: 22px;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .project-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 16px;
        }

        .lang-badge {
            background: rgba(99, 102, 241, 0.1);
            color: #818cf8;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .action-btn {
            background: var(--accent);
            color: white;
            padding: 8px 16px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, box-shadow 0.2s;
        }

        .action-btn:hover {
            background: #4f46e5;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .loader {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        footer {
            text-align: center;
            padding: 25px 0;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="avatar-container">
                <img src="https://github.com/vexornull.png" alt="VexorNull" class="avatar">
                <div class="status-dot" title="Systems Online"></div>
            </div>
            <h1>@<span>VexorNull</span> Hub</h1>
            <p>Centralized Workspace & Live Application Directory</p>
        </header>

        <div class="dashboard-controls">
            <div class="search-bar">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search operational apps & tools...">
            </div>
        </div>

        <div class="projects-grid" id="projectsContainer">
            <div class="loader"><i class="fa-solid fa-circle-notch fa-spin"></i> Initializing workspace directory...</div>
        </div>
    </div>

    <footer>
        &copy; 2026 VexorNull Systems. All rights reserved.
    </footer>

    <script>
        const username = 'vexornull';
        const container = document.getElementById('projectsContainer');
        const searchInput = document.getElementById('searchInput');
        let allProjects = [];

        async function loadProjects() {
            try {
                const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=100`);
                if (!response.ok) throw new Error('Sync failed');
                
                const repos = await response.json();
                
                // Exclude the 'Home' repository itself and any profile readme repo from listing
                allProjects = repos.filter(repo => {
                    const name = repo.name.toLowerCase();
                    return name !== 'home' && name !== username.toLowerCase();
                });
                
                renderProjects(allProjects);
            } catch (err) {
                container.innerHTML = `<div class="loader" style="color: #f87171;"><i class="fa-solid fa-triangle-exclamation"></i> Unable to connect to deployment registry.</div>`;
            }
        }

        function renderProjects(projects) {
            if (projects.length === 0) {
                container.innerHTML = `<div class="loader">No active deployments found.</div>`;
                return;
            }

            container.innerHTML = '';
            projects.forEach(project => {
                const title = project.name;
                const desc = project.description || 'Custom web application workspace.';
                const lang = project.language || 'Application';
                
                // Smart link routing: Handles both Vercel custom domains or GitHub Pages paths cleanly
                // Automatically points to sub-directory live page if hosted on GH Pages under /repo-name/
                const liveUrl = `https://${username}.github.io/${title}/`;

                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    <div class="project-info">
                        <h3><a href="${liveUrl}" target="_blank">${title}</a></h3>
                        <p>${desc}</p>
                    </div>
                    <div class="project-footer">
                        <span class="lang-badge">${lang}</span>
                        <a href="${liveUrl}" target="_blank" class="action-btn">
                            <span>Launch App</span>
                            <i class="fa-solid fa-arrow-up-right-from-square"></i>
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allProjects.filter(p => 
                p.name.toLowerCase().includes(query) || 
                (p.description && p.description.toLowerCase().includes(query))
            );
            renderProjects(filtered);
        });

        loadProjects();
    </script>
</body>
</html>
